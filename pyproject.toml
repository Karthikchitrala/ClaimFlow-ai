[project]
name = "claimflow-ai"
version = "1.0.0"
description = "ClaimFlow AI - Intelligent Expense Claims Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "google-genai>=0.1.1",
    "requests>=2.32.0",
    "pydantic>=2.8.0",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "server_py.main:app"
